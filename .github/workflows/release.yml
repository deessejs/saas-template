name: Release

# Triggered when a staging→main merge commit references `.changeset`, or
# manually via workflow_dispatch (which re-runs the release against any
# changesets already on disk).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '.changeset')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Bump versions, commit, open version PR, create GH release ───────
      # `changesets/action@v1` replaces ~120 lines of custom YAML previously
      # needed to: detect changesets, run `changeset version`, commit the bump,
      # push a tag, and create a GitHub Release. See PR body for trade-offs.
      #
      # Note: pinned to `@v1` (stable). `@v2` is currently prerelease
      # (`v2.0.0-next.3`) and not resolvable on GitHub Actions. Revisit when v2
      # ships stable — see https://github.com/changesets/action/releases.
      #
      # Flow:
      #   1. First push (with changesets) → action opens a "Version Packages" PR
      #   2. PR merged → action re-runs, detects no changesets left, runs the
      #      no-op `publish` script, then creates the GitHub Release
      - name: Create Release Pull Request or Publish
        uses: changesets/action@v1
        with:
          # Template repo: packages are `access: "restricted"`, no npm publish.
          # Echo is a no-op that satisfies the action's required publish-script.
          publish: echo "Template repo — no npm publish needed"
          createGithubReleases: true
          commit: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
